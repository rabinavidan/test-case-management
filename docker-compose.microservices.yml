services:
  # ─── Infrastructure ───────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: testflow
      POSTGRES_PASSWORD: testflow
      POSTGRES_DB: testflow
    volumes:
      - postgres_data_ms:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testflow"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Single-node KRaft broker (no ZooKeeper) — runs' alerts.triggered topic
  # and worker's consumer of it (see services/runs/kafka_events.py,
  # services/worker/kafka_consumer.py) degrade gracefully if this is slow to
  # come up or unreachable, the same way runs/worker already do without
  # Redis — so runs/worker below depend on it with condition: service_started
  # rather than service_healthy.
  kafka:
    image: apache/kafka:3.7.0
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://kafka:19092,CONTROLLER://kafka:19093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:19093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    restart: unless-stopped

  # ─── Auth Service (port 8001) ─────────────────────────────────────────────
  # Builds from the repo root (not services/auth) because main.py imports
  # services.common.* and shared.schemas by their full dotted path — the
  # same convention tests/services/ already runs these apps under. See
  # services/auth/Dockerfile's own comment and issue #217.
  auth:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: postgresql://testflow:testflow@db:5432/testflow
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production}
      SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME:-admin}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-admin123}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@example.com}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # ─── Projects Service (port 8002) ─────────────────────────────────────────
  projects:
    build:
      context: .
      dockerfile: services/projects/Dockerfile
    ports:
      - "8002:8002"
    environment:
      DATABASE_URL: postgresql://testflow:testflow@db:5432/testflow
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production}
      RUNS_SERVICE_URL: http://runs:8003
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # ─── Runs Service (port 8003) ─────────────────────────────────────────────
  runs:
    build:
      context: .
      dockerfile: services/runs/Dockerfile
    ports:
      - "8003:8003"
    environment:
      DATABASE_URL: postgresql://testflow:testflow@db:5432/testflow
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production}
      REDIS_URL: redis://redis:6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      PROJECTS_SERVICE_URL: http://projects:8002
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    restart: unless-stopped

  # ─── Worker (no port — consumes services/runs' runs.populate queue and
  # alerts.triggered topic) ───────────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    environment:
      DATABASE_URL: postgresql://testflow:testflow@db:5432/testflow
      REDIS_URL: redis://redis:6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    restart: unless-stopped

  # ─── AI Service (port 8004) ───────────────────────────────────────────────
  ai:
    build:
      context: .
      dockerfile: services/ai/Dockerfile
    ports:
      - "8004:8004"
    environment:
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      PROJECTS_SERVICE_URL: http://projects:8002
    restart: unless-stopped

  # ─── API Gateway (port 8000) ──────────────────────────────────────────────
  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile_gateway

    ports:
      - "8000:8000"
    environment:
      AUTH_URL: http://auth:8001
      PROJECTS_URL: http://projects:8002
      RUNS_URL: http://runs:8003
      AI_URL: http://ai:8004
    depends_on:
      - auth
      - projects
      - runs
      - ai
    restart: unless-stopped

volumes:
  postgres_data_ms:
