# Agent Workflow Milestone 1 (issue #185) — PR Steward.
#
# Drives every PR toward green automatically: on open/update, on a review,
# or when someone comments "@claude" on a PR, runs Claude Code against the
# PR with .claude/skills/steward/SKILL.md's repo-specific conventions.
#
# Off by default, because every run spends paid Anthropic API tokens: the
# job is skipped unless the repository variable ENABLE_CLAUDE_STEWARD is
# "true". To turn it on, add an ANTHROPIC_API_KEY repository secret and set
# that variable (Settings -> Secrets and variables -> Actions -> Secrets /
# Variables). Skipped is not failed: no other check depends on this one.
name: Claude PR Steward

on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created]

concurrency:
  group: claude-pr-steward-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  steward:
    # Opt-in (see header): skipped unless ENABLE_CLAUDE_STEWARD is "true".
    # issue_comment fires for both issues and PRs — only act on PR comments,
    # and only when they mention @claude (avoid running on every comment).
    if: >
      vars.ENABLE_CLAUDE_STEWARD == 'true' &&
      (github.event_name != 'issue_comment' ||
       (github.event.issue.pull_request != null &&
        contains(github.event.comment.body, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      checks: read
      actions: read
      # claude-code-action exchanges this for a short-lived GitHub token via
      # OIDC — without it, the action fails before ever reaching the
      # ANTHROPIC_API_KEY check, regardless of whether that secret is set.
      id-token: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            You are the PR Steward for this repository. Read
            .claude/skills/steward/SKILL.md first — it has this repo's
            required checks, merge convention, known flake, and what
            counts as a small vs. large fix. Then look at the current PR
            (or the PR this comment is on): if CI is red, diagnose and fix
            it; if there's an unresolved review comment you can address,
            address it. Push a fix rather than only describing one.
