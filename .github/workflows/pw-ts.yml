name: Playwright TypeScript E2E

on:
  push:
    branches: [main]
    paths:
      - 'e2e/**'
      - 'api/**'
      - 'static/**'
  pull_request:
    branches: [main]
  schedule:
    # Run daily at 06:00 UTC against the production Vercel deployment
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Target URL (leave blank to use VERCEL_PRODUCTION_URL secret or localhost)'
        required: false
        default: ''

jobs:
  # Runs the suite as SHARD_TOTAL parallel jobs (Playwright's own sharding —
  # https://playwright.dev/docs/test-sharding), each on its own runner/app
  # instance. fail-fast: false so one shard failing doesn't cancel the
  # others — we want the full failure picture, not just the first shard's.
  # Each shard uploads a "blob" report (enabled in playwright.config.ts only
  # under CI) instead of the human-facing HTML report; merge-reports below
  # combines them back into one HTML/JSON/Allure report, same as if the
  # whole suite had run on a single machine.
  e2e-shard:
    name: E2E Tests (Playwright TypeScript) — shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2]
        shardTotal: [2]
    defaults:
      run:
        working-directory: e2e

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: e2e/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Resolve target URL
        id: url
        run: |
          # Priority: workflow_dispatch input > VERCEL_PRODUCTION_URL secret > localhost (for push/PR)
          if [ -n "${{ inputs.base_url }}" ]; then
            echo "target=${{ inputs.base_url }}" >> $GITHUB_OUTPUT
            echo "local=false" >> $GITHUB_OUTPUT
          elif [ -n "${{ secrets.VERCEL_PRODUCTION_URL }}" ] && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "target=${{ secrets.VERCEL_PRODUCTION_URL }}" >> $GITHUB_OUTPUT
            echo "local=false" >> $GITHUB_OUTPUT
          else
            echo "target=http://localhost:8000" >> $GITHUB_OUTPUT
            echo "local=true" >> $GITHUB_OUTPUT
          fi

      - name: Start app (local runs only)
        if: steps.url.outputs.local == 'true'
        working-directory: .
        env:
          # Many specs authenticate independently in one run — enough to
          # trip the 5/minute auth rate limit meant for real brute-force
          # traffic, not a legitimate test suite. Only relevant here since
          # the real deployment (BASE_URL set) is never rate-limit-disabled.
          TESTFLOW_DISABLE_RATE_LIMIT: "1"
        run: |
          pip install -r requirements.txt
          uvicorn api.main:app --host 0.0.0.0 --port 8000 &
          sleep 3

      - name: Run Playwright tests (this shard)
        id: pw
        run: |
          npx playwright test --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
          echo "exit_code=$?" >> $GITHUB_OUTPUT
        continue-on-error: true
        env:
          BASE_URL: ${{ steps.url.outputs.target }}
          CI: true

      - name: Upload blob report (this shard)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-${{ matrix.shardIndex }}
          path: e2e/blob-report/
          retention-days: 1
          if-no-files-found: ignore

      - name: Upload raw Allure results (this shard)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-pw-ts-${{ matrix.shardIndex }}
          path: e2e/allure-results/
          retention-days: 1
          if-no-files-found: ignore

      - name: Propagate exit code
        if: always()
        run: exit ${{ steps.pw.outputs.exit_code }}

  # Combines every shard's blob report into one HTML+JSON report (the same
  # job-summary script as before now reads the merged JSON) and every
  # shard's raw Allure results into one Allure report — exactly what a
  # single unsharded run would have produced.
  merge-reports:
    name: Merge Playwright shard reports
    if: always()
    needs: [e2e-shard]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2e

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: e2e/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Download blob reports from every shard
        uses: actions/download-artifact@v4
        with:
          path: e2e/all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge into one HTML + JSON report
        run: |
          mkdir -p test-results
          npx playwright merge-reports --reporter=html ./all-blob-reports
          npx playwright merge-reports --reporter=json ./all-blob-reports > test-results/results.json

      - name: Write job summary
        if: always()
        working-directory: e2e
        run: |
          node - <<'EOF'
          const fs = require('fs');
          const path = require('path');
          const summaryFile = process.env.GITHUB_STEP_SUMMARY;
          const jsonPath = path.join('test-results', 'results.json');

          if (!fs.existsSync(jsonPath)) {
            fs.appendFileSync(summaryFile, '## ❌ Playwright Report\n\nTest run crashed before producing a report — check the logs.\n');
            process.exit(0);
          }

          const r = JSON.parse(fs.readFileSync(jsonPath, 'utf8'));

          let passed = 0, failed = 0, skipped = 0, flaky = 0, duration = 0;
          const failures = [];

          for (const suite of r.suites || []) {
            for (const spec of (suite.specs || [])) {
              for (const test of (spec.tests || [])) {
                const status = test.status;
                const ms = (test.results || []).reduce((a, x) => a + (x.duration || 0), 0);
                duration += ms;
                if (status === 'expected') passed++;
                else if (status === 'unexpected') {
                  failed++;
                  const lastResult = (test.results || []).slice(-1)[0] || {};
                  failures.push({ title: spec.title, file: suite.file || suite.title, error: lastResult.error?.message || '' });
                } else if (status === 'skipped') skipped++;
                else if (status === 'flaky') { flaky++; passed++; }
              }
            }
          }

          const total = passed + failed + skipped;
          const icon = failed === 0 ? '✅' : '❌';
          const dur = (duration / 1000).toFixed(1);

          const lines = [
            `## ${icon} Playwright E2E Report (shards merged)`,
            `| Result | Count |`,
            `|--------|-------|`,
            `| ✅ Passed | ${passed} |`,
            `| ❌ Failed | ${failed} |`,
            `| ⏭ Skipped | ${skipped} |`,
            `| 🔁 Flaky  | ${flaky} |`,
            `| **Total** | **${total}** |`,
            `| ⏱ Duration | ${dur}s |`,
            '',
          ];

          if (failures.length > 0) {
            lines.push('### Failed Tests');
            for (const f of failures) {
              const errSnippet = f.error ? f.error.split('\n').slice(0, 6).join('\n') : 'No error message';
              lines.push(`<details><summary>❌ <code>${f.title}</code> — ${f.file}</summary>\n\n\`\`\`\n${errSnippet}\n\`\`\`\n</details>`);
            }
            lines.push('');
          }

          fs.appendFileSync(summaryFile, lines.join('\n'));
          EOF

      - name: Download raw Allure results from every shard
        if: always()
        uses: actions/download-artifact@v4
        with:
          path: e2e/allure-results
          pattern: allure-results-pw-ts-*
          merge-multiple: true

      - name: Set up Java (for Allure report generation)
        if: always()
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Generate Allure report (all shards combined)
        if: always()
        working-directory: e2e
        run: npm run allure:generate

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-report-playwright-ts-${{ github.run_id }}
          path: e2e/allure-report/
          retention-days: 14

      - name: Upload merged HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/results.json
          retention-days: 7

  # A stable-named gate: keeps the "E2E Tests (Playwright TypeScript)" check
  # — whatever branch protection may reference — reporting exactly once,
  # regardless of how many shards run internally. Fails iff any shard failed.
  e2e:
    name: E2E Tests (Playwright TypeScript)
    if: always()
    needs: [e2e-shard, merge-reports]
    runs-on: ubuntu-latest
    steps:
      - name: Check shard results
        run: |
          if [ "${{ needs.e2e-shard.result }}" != "success" ]; then
            echo "One or more E2E shards failed — see the shard jobs and the merged report for details."
            exit 1
          fi
          echo "All E2E shards passed."
