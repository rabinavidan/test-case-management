# Milestone 2 of the AI eval-harness work (see evals/README.md) — runs the
# harness for real, against a real (small, CPU-friendly) local Ollama
# model, instead of only the mocked unit tests that already run in
# test.yml. Only triggers when the prompts under test or the harness
# itself change, since it downloads a model and runs several LLM calls per
# case — not something every unrelated PR should pay for.
#
# --gate now checks against a committed per-model baseline
# (evals/baselines/<model>/<target>.json, see evals/baseline.py) instead of
# a fixed absolute threshold, once one exists for the model this job runs.
# A baseline's own recorded run-to-run consistency (consistency_stdev) sets
# the noise band, so ordinary model variance doesn't fail the job but a
# real regression does — this job is no longer purely informational for a
# model with a recorded baseline (eval-harness itself still isn't a
# required status check, so it never blocks a merge on its own; a red run
# here is a real signal to look at, not something that stops anyone).
#
# Trigger a run with record_baseline=true (Actions tab → Run workflow) to
# deliberately refresh the committed baseline instead of gating against it
# — the one command the plan asks for. It commits straight to whatever ref
# the dispatch ran on, so the result is a normal, reviewable diff: dispatch
# from a feature branch to review before merging, or from main if a
# maintainer means to update it directly.
name: AI Eval Harness

on:
  pull_request:
    paths:
      - "api/ai_prompts.py"
      - "evals/**"
      - ".github/workflows/eval-harness.yml"
  workflow_dispatch:
    inputs:
      record_baseline:
        description: "Refresh the committed baseline instead of gating against it"
        type: boolean
        default: false

jobs:
  eval-harness:
    runs-on: ubuntu-latest
    # A baseline refresh commits back to the dispatched ref - needs write access.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt httpx==0.25.2

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama server
        run: |
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do
            curl -s http://127.0.0.1:11434/api/version && break
            sleep 1
          done

      - name: Pull eval model
        # A small model (~400MB) so this job stays fast on a CPU runner;
        # see evals/README.md for why the resulting scores are noisier
        # than a larger model's would be.
        run: ollama pull qwen2.5:0.5b

      - name: Run AI Test Generation eval
        id: eval_test_generation
        run: |
          mkdir -p evals/reports
          if [ "${{ inputs.record_baseline }}" = "true" ]; then
            python -m evals.cli --target test_generation --model qwen2.5:0.5b --runs 5 \
              --output evals/reports/test_generation.json --record-baseline
          else
            python -m evals.cli --target test_generation --model qwen2.5:0.5b --runs 5 \
              --output evals/reports/test_generation.json --gate
          fi

      - name: Run AI Failure Triage eval
        id: eval_triage
        if: always()
        run: |
          mkdir -p evals/reports
          if [ "${{ inputs.record_baseline }}" = "true" ]; then
            python -m evals.cli --target triage --model qwen2.5:0.5b --runs 5 \
              --output evals/reports/triage.json --record-baseline
          else
            python -m evals.cli --target triage --model qwen2.5:0.5b --runs 5 \
              --output evals/reports/triage.json --gate
          fi

      - name: Commit refreshed baseline
        if: ${{ inputs.record_baseline == true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add evals/baselines/
          if git diff --cached --quiet; then
            echo "No baseline changes to commit."
          else
            git commit -m "Refresh qwen2.5:0.5b eval baseline (workflow_dispatch)"
            git push
          fi

      - name: Write job summary
        if: always()
        run: |
          python - <<'EOF'
          import json, os, pathlib

          recording = "${{ inputs.record_baseline }}" == "true"
          title = "🧪 AI Eval Harness — qwen2.5:0.5b"
          title += " (baseline refreshed)" if recording else " (gated against the committed baseline where one exists)"
          lines = [f"## {title}", ""]
          for target, outcome in [
              ("test_generation", "${{ steps.eval_test_generation.outcome }}"),
              ("triage", "${{ steps.eval_triage.outcome }}"),
          ]:
              report_path = pathlib.Path(f"evals/reports/{target}.json")
              passed = outcome == "success"
              icon = "✅" if passed else "❌"
              verb = "recorded" if recording else "gate passed"
              status = f"{verb}" if passed else ("recording failed" if recording else "gate failed")
              lines.append(f"### {icon} {target} — {status}")
              if not report_path.exists():
                  lines.append("_No report produced — the eval run itself failed before writing one._\n")
                  continue
              report = json.loads(report_path.read_text())
              lines += ["", "| Case | Runs | Mean scores | Consistency (stdev) | Error rate |",
                        "|------|------|-------------|----------------------|------------|"]
              for case in report["cases"]:
                  means = ", ".join(f"{k}={v:.2f}" for k, v in case["mean_scores"].items())
                  stdev = ", ".join(f"{k}={v:.2f}" for k, v in case["consistency_stdev"].items())
                  lines.append(f"| `{case['case_id']}` | {case['runs']} | {means} | {stdev} | {case['error_rate']:.0%} |")
              lines.append("")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("\n".join(lines))
          EOF

      - name: Upload eval reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-harness-reports-${{ github.run_id }}
          path: evals/reports/
          retention-days: 14
          if-no-files-found: ignore
