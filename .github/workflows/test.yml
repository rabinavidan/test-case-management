name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        run: ruff check .

  api-tests:
    name: Unit, API, Contract & Services Tests (pytest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      - name: Run unit + API + contract + services tests
        id: pytest
        continue-on-error: true
        run: |
          set +e
          python -m pytest tests/unit tests/api tests/contract tests/services -v \
            --json-report --json-report-file=report.json \
            --alluredir=allure-results \
            --cov --cov-report=term-missing --cov-report=json:coverage.json --cov-fail-under=85
          exit_code=$?
          set -e
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-${{ github.run_id }}
          path: coverage.json
          retention-days: 14

      - name: Write job summary
        if: always()
        run: |
          python - <<'EOF'
          import json, os, pathlib
          p = pathlib.Path("report.json")
          if not p.exists():
            with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("## ❌ API Test Report\n\nTest run crashed before producing a report — check the logs.\n")
            raise SystemExit(0)
          r = json.loads(p.read_text())
          s = r["summary"]
          passed = s.get("passed", 0)
          failed = s.get("failed", 0)
          error  = s.get("error", 0)
          total  = s.get("total", 0)
          duration = r.get("duration", 0)
          icon   = "✅" if failed == 0 and error == 0 else "❌"
          lines  = [
            f"## {icon} Unit / API / Contract / Services Test Report",
            "| Result | Count |",
            "|--------|-------|",
            f"| ✅ Passed | {passed} |",
            f"| ❌ Failed | {failed} |",
            f"| 💥 Error  | {error}  |",
            f"| **Total** | **{total}** |",
            f"| ⏱ Duration | {duration:.2f}s |",
            "",
          ]
          cov_path = pathlib.Path("coverage.json")
          if cov_path.exists():
            cov = json.loads(cov_path.read_text())["totals"]
            pct = cov["percent_covered"]
            cov_icon = "✅" if pct >= 85 else "❌"
            lines += [
              f"### {cov_icon} Coverage — {pct:.1f}% (threshold: 85%)",
              f"{cov['covered_lines']} / {cov['num_statements']} statements covered "
              f"across `api/`, `services/`, `shared/`.",
              "",
            ]
          lines += [
            "### Test Results",
            "| Test | Result | Duration |",
            "|------|--------|----------|",
          ]
          for t in r.get("tests", []):
            name = t["nodeid"].split("::")[-1]
            outcome = t["outcome"]
            dur = (t.get("call") or {}).get("duration", 0)
            if outcome == "passed":
              badge = "✅ passed"
            elif outcome == "failed":
              badge = "❌ failed"
            else:
              badge = "💥 error"
            lines.append(f"| `{name}` | {badge} | {dur:.3f}s |")
          lines.append("")
          for t in r.get("tests", []):
            if t["outcome"] in ("failed", "error"):
              name = t["nodeid"].split("::")[-1]
              msg  = (t.get("call") or t.get("setup") or {}).get("longrepr", "")
              lines.append(f"<details><summary>❌ <code>{name}</code> — failure detail</summary>\n\n```\n{msg}\n```\n</details>")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
            f.write("\n".join(lines))
          EOF

      - name: Set up Java (for Allure report generation)
        if: always()
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Generate Allure report
        if: always()
        run: |
          npm install -g allure-commandline --no-progress
          allure generate allure-results --clean -o allure-report

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-report-pytest-${{ github.run_id }}
          path: allure-report/
          retention-days: 14

      - name: Propagate exit code
        if: always()
        run: exit ${{ steps.pytest.outputs.exit_code }}

  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    # Only run E2E on push to main (after Vercel deploys)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: api-tests

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Run E2E tests
        env:
          BASE_URL: ${{ secrets.VERCEL_PRODUCTION_URL }}
          E2E_USERNAME: ${{ secrets.E2E_USERNAME }}
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: python -m pytest tests/e2e/test_e2e.py --base-url=${{ secrets.VERCEL_PRODUCTION_URL }} -v
        # E2E failures are non-blocking — remove 'continue-on-error' to make them blocking
        continue-on-error: true

      - name: Upload failure screenshots/videos/traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-failure-artifacts-${{ github.run_id }}
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore
