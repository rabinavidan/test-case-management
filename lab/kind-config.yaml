# Local practice cluster: 1 control plane + 4 workers, one worker per
# environment, so each environment runs on its own node. kind can't rename a
# node's kubernetes.io/hostname, so the overlays (k8s/overlays/lab/*) select
# on the testflow.io/env label instead.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: testflow-lab
nodes:
  - role: control-plane
  - role: worker
    labels: { testflow.io/env: staging }
  - role: worker
    labels: { testflow.io/env: regression }
  - role: worker
    labels: { testflow.io/env: preprod }
  - role: worker
    labels: { testflow.io/env: prod }
