# In-cluster Kafka + MongoDB for the local kind lab (lab/README.md). base/
# already runs Postgres (db) and Redis in-cluster; this component adds the
# two services only the lab runs.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - kafka.yaml
  - mongo.yaml

configMapGenerator:
  - name: testflow-config
    behavior: merge
    literals:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - MONGO_URL=mongodb://mongo:27017
