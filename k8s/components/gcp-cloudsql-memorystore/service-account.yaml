# Workload Identity binding: this KSA impersonates a GSA with
# roles/cloudsql.client (no static service-account key). Bind them with:
#   gcloud iam service-accounts add-iam-policy-binding \
#     WORKLOAD_IDENTITY_GSA@PROJECT_ID.iam.gserviceaccount.com \
#     --role roles/iam.workloadIdentityUser \
#     --member "serviceAccount:PROJECT_ID.svc.id.goog[NAMESPACE/cloudsql-proxy]"
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloudsql-proxy
  annotations:
    iam.gke.io/gcp-service-account: WORKLOAD_IDENTITY_GSA@PROJECT_ID.iam.gserviceaccount.com
