apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  labels: { app: auth }
spec:
  replicas: 1
  selector:
    matchLabels: { app: auth }
  template:
    metadata:
      labels: { app: auth }
    spec:
      containers:
        - name: auth
          image: testflow/auth
          ports:
            - containerPort: 8001
          envFrom:
            - configMapRef: { name: testflow-config }
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: testflow-secrets, key: DATABASE_URL } }
            - name: JWT_SECRET_KEY
              valueFrom: { secretKeyRef: { name: testflow-secrets, key: JWT_SECRET_KEY } }
          readinessProbe:
            httpGet: { path: /docs, port: 8001 }
            initialDelaySeconds: 5
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: auth
spec:
  selector:
    app: auth
  ports:
    - port: 8001
      targetPort: 8001
