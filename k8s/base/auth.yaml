apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  labels: { app: auth }
spec:
  replicas: 1
  selector:
    matchLabels: { app: auth }
  template:
    metadata:
      labels:
        app: auth
        # Datadog unified service tagging + log source (docs/datadog.md).
        tags.datadoghq.com/service: auth
      annotations:
        ad.datadoghq.com/auth.logs: '[{"source":"python","service":"auth"}]'
    spec:
      containers:
        - name: auth
          image: testflow/auth
          ports:
            - containerPort: 8001
          envFrom:
            - configMapRef: { name: testflow-config }
          env:
            # Datadog: the node-local Agent (DaemonSet, hostPort 8126) and this
            # service's name. On/off, env and log injection come from
            # testflow-config (DD_TRACE_ENABLED defaults to "false").
            - name: DD_AGENT_HOST
              valueFrom: { fieldRef: { fieldPath: status.hostIP } }
            - name: DD_SERVICE
              value: auth
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: testflow-secrets, key: DATABASE_URL } }
            - name: JWT_SECRET_KEY
              valueFrom: { secretKeyRef: { name: testflow-secrets, key: JWT_SECRET_KEY } }
          # /health/live never checks a dependency (see services/common/health.py),
          # so a database outage pulls pods out of rotation via readiness instead
          # of restarting every replica at once via liveness.
          startupProbe:
            httpGet: { path: /health/live, port: 8001 }
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet: { path: /health/live, port: 8001 }
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /health/ready, port: 8001 }
            periodSeconds: 5
            failureThreshold: 2
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: auth
spec:
  selector:
    app: auth
  ports:
    - port: 8001
      targetPort: 8001
