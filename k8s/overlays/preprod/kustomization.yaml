apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: testflow-preprod

resources:
  - ../../base
  - namespace.yaml
  - ingress.yaml

# GKE Autopilot + Cloud SQL + Memorystore wiring (Milestone 2) — see
# k8s/components/gcp-cloudsql-memorystore/kustomization.yaml for what this
# swaps in place of the in-cluster db/redis from base/.
components:
  - ../../components/gcp-cloudsql-memorystore

patches:
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          kubernetes.io/hostname: node-preprod-1

replicas:
  - name: gateway
    count: 2
  - name: auth
    count: 1
  - name: projects
    count: 2
  - name: runs
    count: 2
  - name: ai
    count: 1
  - name: worker
    count: 2

configMapGenerator:
  - name: testflow-config
    behavior: merge
    literals:
      - ENVIRONMENT=preprod

secretGenerator:
  - name: testflow-secrets
    behavior: merge
    literals:
      - JWT_SECRET_KEY=REPLACE_ME_preprod_jwt_secret

# Preprod tracks the same release candidate that's about to be promoted to
# prod — a fixed tag bumped by CI right before a prod rollout, not `:latest`.
images:
  - name: testflow/gateway
    newName: REGION-docker.pkg.dev/PROJECT_ID/testflow/gateway
    newTag: v2.0.66-rc1
  - name: testflow/auth
    newName: REGION-docker.pkg.dev/PROJECT_ID/testflow/auth
    newTag: v2.0.66-rc1
  - name: testflow/projects
    newName: REGION-docker.pkg.dev/PROJECT_ID/testflow/projects
    newTag: v2.0.66-rc1
  - name: testflow/runs
    newName: REGION-docker.pkg.dev/PROJECT_ID/testflow/runs
    newTag: v2.0.66-rc1
  - name: testflow/ai
    newName: REGION-docker.pkg.dev/PROJECT_ID/testflow/ai
    newTag: v2.0.66-rc1
  - name: testflow/worker
    newName: REGION-docker.pkg.dev/PROJECT_ID/testflow/worker
    newTag: v2.0.66-rc1
