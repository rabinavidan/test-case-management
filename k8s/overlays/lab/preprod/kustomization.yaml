# Local kind lab — preprod (see lab/README.md). Same base as the GKE overlays,
# plus in-cluster Kafka + MongoDB; every workload pinned to the kind worker
# labelled testflow.io/env=preprod (lab/kind-config.yaml).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: testflow-preprod

resources:
  - ../../../base
  - namespace.yaml

components:
  - ../../../components/lab-infra

patches:
  - target:
      kind: (Deployment|StatefulSet)
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          testflow.io/env: preprod

configMapGenerator:
  - name: testflow-config
    behavior: merge
    literals:
      - ENVIRONMENT=preprod

images:
  - { name: testflow/gateway, newTag: lab }
  - { name: testflow/auth, newTag: lab }
  - { name: testflow/projects, newTag: lab }
  - { name: testflow/runs, newTag: lab }
  - { name: testflow/ai, newTag: lab }
  - { name: testflow/worker, newTag: lab }
