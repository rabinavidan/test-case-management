apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: testflow-staging

resources:
  - ../../base
  - namespace.yaml
  - ingress.yaml

# GKE Autopilot + Cloud SQL + Memorystore wiring (Milestone 2) — see
# k8s/components/gcp-cloudsql-memorystore/kustomization.yaml for what this
# swaps in place of the in-cluster db/redis from base/.
components:
  - ../../components/gcp-cloudsql-memorystore

# Every service in this environment is scheduled onto its own dedicated node —
# see the in-app Environments dashboard (GET /api/environments), which reports
# this same node_name for the "Staging" card.
patches:
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          kubernetes.io/hostname: node-staging-1

replicas:
  - name: gateway
    count: 1
  - name: auth
    count: 1
  - name: projects
    count: 1
  - name: runs
    count: 1
  - name: ai
    count: 1

configMapGenerator:
  - name: testflow-config
    behavior: merge
    literals:
      - ENVIRONMENT=staging

secretGenerator:
  - name: testflow-secrets
    behavior: merge
    literals:
      - JWT_SECRET_KEY=REPLACE_ME_staging_jwt_secret

images:
  - name: testflow/gateway
    newName: REGION-docker.pkg.dev/PROJECT_ID/testflow/gateway
    newTag: staging
  - name: testflow/auth
    newName: REGION-docker.pkg.dev/PROJECT_ID/testflow/auth
    newTag: staging
  - name: testflow/projects
    newName: REGION-docker.pkg.dev/PROJECT_ID/testflow/projects
    newTag: staging
  - name: testflow/runs
    newName: REGION-docker.pkg.dev/PROJECT_ID/testflow/runs
    newTag: staging
  - name: testflow/ai
    newName: REGION-docker.pkg.dev/PROJECT_ID/testflow/ai
    newTag: staging
