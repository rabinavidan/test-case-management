apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: testflow-prod

resources:
  - ../../base
  - namespace.yaml
  - ingress.yaml

# GKE Autopilot + Cloud SQL + Memorystore wiring (Milestone 2) — see
# k8s/components/gcp-cloudsql-memorystore/kustomization.yaml for what this
# swaps in place of the in-cluster db/redis from base/.
components:
  - ../../components/gcp-cloudsql-memorystore

patches:
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          kubernetes.io/hostname: node-prod-1

replicas:
  - name: gateway
    count: 3
  - name: auth
    count: 2
  - name: projects
    count: 2
  - name: runs
    count: 3
  - name: ai
    count: 2

configMapGenerator:
  - name: testflow-config
    behavior: merge
    literals:
      - ENVIRONMENT=prod

secretGenerator:
  - name: testflow-secrets
    behavior: merge
    literals:
      - JWT_SECRET_KEY=REPLACE_ME_prod_jwt_secret

# Prod pins the exact version that passed preprod — never `:latest`.
images:
  - name: testflow/gateway
    newName: REGION-docker.pkg.dev/PROJECT_ID/testflow/gateway
    newTag: v2.0.66
  - name: testflow/auth
    newName: REGION-docker.pkg.dev/PROJECT_ID/testflow/auth
    newTag: v2.0.66
  - name: testflow/projects
    newName: REGION-docker.pkg.dev/PROJECT_ID/testflow/projects
    newTag: v2.0.66
  - name: testflow/runs
    newName: REGION-docker.pkg.dev/PROJECT_ID/testflow/runs
    newTag: v2.0.66
  - name: testflow/ai
    newName: REGION-docker.pkg.dev/PROJECT_ID/testflow/ai
    newTag: v2.0.66
