# Parallel execution is INTENTIONALLY DISABLED for the same reason as
# java-tests/src/test/resources/junit-platform.properties: this suite drives
# the same live TestFlow instance over real HTTP/UI actions, and that
# properties file's comment documents a reproducible backend race
# (concurrent DELETE + GET against the shared uvicorn/SQLite instance) found
# while validating parallel execution there. Since this suite exercises the
# same delete-then-verify-gone paths (e.g. deleting a suite), it's exposed
# to the same class of bug — untested here specifically, but not worth
# risking given the confirmed sibling suite's failure rate.
#
# support/BaseTest.java's ThreadLocal<Browser> fix is kept regardless of
# this being disabled: a `private static Browser` shared across subclasses
# was a real bug in its own right (one class's @AfterAll could close a
# browser another class's tests were still using) independent of the
# backend issue, and ThreadLocal is correct with or without concurrent
# classes enabled. Flip enabled=true here once the backend race is fixed
# and this suite's own delete-path tests have been validated the same way.
junit.jupiter.execution.parallel.enabled=false
junit.jupiter.execution.parallel.mode.default=same_thread
junit.jupiter.execution.parallel.mode.classes.default=concurrent
junit.jupiter.execution.parallel.config.strategy=dynamic
junit.jupiter.execution.parallel.config.dynamic.factor=1
