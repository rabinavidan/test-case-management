[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
# Default base URL for E2E tests — override with --base-url=... on the CLI
base_url = https://test-case-management-rabinavidans-projects.vercel.app
# pytest-playwright: capture a screenshot, video, and trace for any browser test
# (tests/e2e/) that fails, mirroring e2e/playwright.config.ts on the TypeScript
# side. No-op for unit/api/contract/services tests, which never touch the
# page/context fixtures. Artifacts land under test-results/ (see .gitignore).
addopts = --screenshot=only-on-failure --video=retain-on-failure --tracing=retain-on-failure
markers =
    unit: fast isolated unit tests with no I/O (auth token/hash logic)
    api: FastAPI TestClient integration tests against an in-memory SQLite DB
    contract: Schemathesis property-based tests of the API against its own OpenAPI schema
    services: FastAPI TestClient integration tests for the services/ microservices (auth/projects/runs/ai/gateway)
    e2e: Playwright browser and API tests that exercise a running deployment
    regression: marks tests as part of the regression suite (Playwright E2E)
# Stream pw.* logs live during test runs (shows step/action/assert/failure details)
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s  %(levelname)-7s  %(name)s  %(message)s
log_cli_date_format = %H:%M:%S
