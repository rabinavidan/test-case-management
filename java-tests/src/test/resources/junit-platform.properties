# Parallel execution is INTENTIONALLY DISABLED — see the investigation
# below before flipping enabled=true. This isn't a "not implemented yet";
# it was implemented, tested, and reverted because it found a real bug.
#
# Test-side isolation is fine: every test creates its own uniquely-named
# data (TestData.uniqueName()) and BaseApiTest's shared REST Assured static
# config is set to the same value by every class. The problem is server-side:
# these tests drive a *live* TestFlow instance over real HTTP, and with
# classes=concurrent/methods=same_thread enabled, 3 of 4 local runs against
# uvicorn (api/main.py, SQLite) reproducibly failed —
# ProjectsApiTest.deletingAProjectRemovesItAndCascadesToItsSuites and
# SuitesApiTest.deletingASuiteRemovesIt got 200 instead of 404 right after
# a cascading DELETE committed, i.e. a concurrent GET raced the delete's
# commit and won. Confirmed by A/B: 4/4 clean runs with parallelism off,
# 3/4 with it on. This is a real backend concurrency bug (SQLite +
# synchronous SQLAlchemy sessions under uvicorn's threadpool, most likely),
# not a test-suite flaw — tracked as issue #214; fix that first, then revisit
# enabling this.
junit.jupiter.execution.parallel.enabled=false
junit.jupiter.execution.parallel.mode.default=same_thread
junit.jupiter.execution.parallel.mode.classes.default=concurrent
junit.jupiter.execution.parallel.config.strategy=dynamic
junit.jupiter.execution.parallel.config.dynamic.factor=1
