[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
# Default rule set (pyflakes + a slice of pycodestyle) — catches unused
# imports/variables, redefinitions, and import-shadowing bugs without
# forcing a full style rewrite of existing code.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Package __init__.py files re-export names for their package's public API;
# those imports are "unused" within the file itself by design.
"**/__init__.py" = ["F401"]
